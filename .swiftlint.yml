included:
  - Veya
  - SpotCoreKit/Sources
  - SpotCoreKit/Tests
  - VeyaUITests
excluded:
  # Generated by scripts/build-xcframework.sh.
  - SpotCoreKit/Sources/SpotCoreKit/spotcore.swift
  - SpotCoreKit/.build
strict: true
custom_rules:
  unscaled_font:
    included: "Veya/.*\\.swift"
    regex: "\\.font\\("
    message: "Use .scaledFont(size:) or a Theme ScaledFont so Settings > Text size applies (PBI-801)."
    severity: error
