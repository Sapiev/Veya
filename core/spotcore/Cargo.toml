[package]
name = "spotcore"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
publish = false
description = "Thin Rust core wrapping librespot for the Veya macOS app"

[lib]
crate-type = ["staticlib", "lib"]

[dependencies]
librespot-core = { git = "https://github.com/librespot-org/librespot", rev = "d36f9f1907e8cc9d68a93f8ebc6b627b1bf7267d", default-features = false, features = [
    "rustls-tls-native-roots",
] }
librespot-playback = { git = "https://github.com/librespot-org/librespot", rev = "d36f9f1907e8cc9d68a93f8ebc6b627b1bf7267d", default-features = false, features = [
    "rustls-tls-native-roots",
] }
librespot-connect = { git = "https://github.com/librespot-org/librespot", rev = "d36f9f1907e8cc9d68a93f8ebc6b627b1bf7267d", default-features = false, features = [
    "rustls-tls-native-roots",
] }
librespot-discovery = { git = "https://github.com/librespot-org/librespot", rev = "d36f9f1907e8cc9d68a93f8ebc6b627b1bf7267d", default-features = false, features = [
    "rustls-tls-native-roots",
] }
librespot-metadata = { git = "https://github.com/librespot-org/librespot", rev = "d36f9f1907e8cc9d68a93f8ebc6b627b1bf7267d", default-features = false, features = [
    "rustls-tls-native-roots",
] }
librespot-protocol = { git = "https://github.com/librespot-org/librespot", rev = "d36f9f1907e8cc9d68a93f8ebc6b627b1bf7267d" }
protobuf = "3"
rand = { version = "0.9", default-features = false, features = ["small_rng"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uniffi = { workspace = true, features = ["tokio"] }
# UniFFI's tokio support runs on async-compat's runtime, single-threaded
# unless this feature is on.
async-compat = { version = "0.2", features = ["multi-thread"] }
thiserror = "2"
log = "0.4"
regex = "1"
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
tokio = { version = "1", features = ["rt", "net", "io-util", "time", "sync", "macros"] }
oauth2 = { version = "5.0", default-features = false, features = ["reqwest"] }
# librespot-oauth already enables webpki roots in the graph; the feature is
# named here only so auth.rs can switch those roots off.
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls-native-roots",
    "rustls-tls-webpki-roots-no-provider",
] }
rtrb = "0.4.0"
indexmap = "2"
futures-util = { version = "0.3", default-features = false }
http = "1"
percent-encoding = "2"
rusqlite = { version = "0.40", features = ["bundled"] }

# Bonjour (dns-sd) on macOS, pure-Rust libmdns elsewhere (ADR-0009).
[target.'cfg(target_os = "macos")'.dependencies]
librespot-discovery = { git = "https://github.com/librespot-org/librespot", rev = "d36f9f1907e8cc9d68a93f8ebc6b627b1bf7267d", default-features = false, features = ["with-dns-sd"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
librespot-discovery = { git = "https://github.com/librespot-org/librespot", rev = "d36f9f1907e8cc9d68a93f8ebc6b627b1bf7267d", default-features = false, features = ["with-libmdns"] }

[dev-dependencies]
base64 = "0.23"
sha2 = "0.11"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "test-util"] }
