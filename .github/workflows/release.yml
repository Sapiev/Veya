name: Release

# Pushing a tag v<version> (v1.2.0, or v1.2.0-beta.1 for the beta channel)
# publishes a self-signed DMG (not notarized), its appcast entry and, for stable versions, the
# Homebrew cask. Secrets and one-time setup: docs/release.md.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 90
    env:
      SPARKLE_VERSION: 2.10.0
      SPARKLE_SHA256: c2bf58aa8387266ac179357b1415d6f2635f044da8be41042af32425dae6da0c
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # scripts/release.sh numbers builds by commit count.
          fetch-depth: 0
      - name: Version and release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          scripts/changelog-section.sh "$version" > "$RUNNER_TEMP/notes.md"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          [[ "$version" == *-* ]] && prerelease=true || prerelease=false
          echo "PRERELEASE=$prerelease" >> "$GITHUB_ENV"
      - name: Install Rust toolchain
        working-directory: core
        run: rustup toolchain install
      - name: Import signing certificate
        env:
          P12: ${{ secrets.SIGNING_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.SIGNING_CERT_P12_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/release.keychain-db"
          password="$(uuidgen)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 7200 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          base64 --decode <<< "$P12" > "$RUNNER_TEMP/signing.p12"
          security import "$RUNNER_TEMP/signing.p12" -k "$keychain" -P "$P12_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/signing.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" > /dev/null
      - name: Build and sign
        env:
          SIGNING_IDENTITY: Veya Release
        run: |
          SIGNING_KEYCHAIN="$RUNNER_TEMP/release.keychain-db" scripts/release.sh "$VERSION"
          echo "DMG=$PWD/build/release/Veya-$VERSION.dmg" >> "$GITHUB_ENV"
      # Reruns replace the asset; appcast and cask below follow the new DMG.
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          [[ "$PRERELEASE" == true ]] && flags=(--prerelease)
          gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "Veya $VERSION" --notes-file "$RUNNER_TEMP/notes.md" "${flags[@]}"
          gh release upload "$GITHUB_REF_NAME" "$DMG" --clobber
      - name: Sign update
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          curl -fsSL -o "$RUNNER_TEMP/sparkle.tar.xz" \
            "https://github.com/sparkle-project/Sparkle/releases/download/$SPARKLE_VERSION/Sparkle-$SPARKLE_VERSION.tar.xz"
          echo "$SPARKLE_SHA256  $RUNNER_TEMP/sparkle.tar.xz" | shasum -a 256 -c
          mkdir "$RUNNER_TEMP/sparkle"
          tar -xf "$RUNNER_TEMP/sparkle.tar.xz" -C "$RUNNER_TEMP/sparkle"
          signature="$(echo "$SPARKLE_ED_PRIVATE_KEY" | "$RUNNER_TEMP/sparkle/bin/sign_update" --ed-key-file - -p "$DMG")"
          echo "SIGNATURE=$signature" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: gh-pages
          path: pages
      - name: Publish appcast
        working-directory: pages
        run: |
          ../scripts/update-appcast.py appcast.xml "$VERSION" "$(git -C .. rev-list --count HEAD)" \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/Veya-$VERSION.dmg" \
            "$SIGNATURE" "$(stat -f%z "$DMG")" "$RUNNER_TEMP/notes.md"
          git add appcast.xml
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com \
            commit -m "appcast: Veya $VERSION"
          git push
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.PRERELEASE == 'false'
        with:
          repository: Sapiev/homebrew-veya
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap
      - name: Update Homebrew cask
        if: env.PRERELEASE == 'false'
        working-directory: tap
        run: |
          mkdir -p Casks
          sed -e "s/@VERSION@/$VERSION/" -e "s/@SHA256@/$(shasum -a 256 "$DMG" | cut -d' ' -f1)/" \
            ../packaging/homebrew/veya.rb > Casks/veya.rb
          git add Casks/veya.rb
          git diff --cached --quiet && exit 0
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com \
            commit -m "veya $VERSION"
          git push
      - name: Remove signing keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/release.keychain-db" || true
