name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: xcode-27
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install linters
        run: |
          scripts/install-linters.sh
          echo "$GITHUB_WORKSPACE/.tools/bin" >> "$GITHUB_PATH"
      - name: SwiftLint
        run: swiftlint lint --quiet --reporter github-actions-logging
      - name: SwiftFormat
        run: swiftformat --lint .
      - name: Localizations
        run: scripts/check-localizations.sh
      - name: Release script tests
        run: python3 -m unittest discover -s scripts/tests
      # rustfmt only; overrides rust-toolchain.toml so clippy and the
      # cross-target std libraries are not downloaded.
      - name: Install rustfmt
        run: rustup toolchain install stable --profile minimal --component rustfmt
      - name: rustfmt
        working-directory: core
        env:
          RUSTUP_TOOLCHAIN: stable
        run: cargo fmt --all --check

  build-test:
    # Veya.xcodeproj (objectVersion 90) needs Xcode 26, the image default.
    runs-on: xcode-27
    # A cold cache compiles librespot three times (host debug, two release
    # arches); a timeout saves no cache, so every later run would be cold too.
    timeout-minutes: 120
    env:
      SPM_DIR: ${{ github.workspace }}/.build/spm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Reads core/rust-toolchain.toml; must run before rust-cache so the
      # cache key includes the resolved rustc version.
      - name: Install Rust toolchain
        working-directory: core
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: core -> target
      - name: Clippy
        working-directory: core
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Rust tests
        working-directory: core
        run: cargo test --workspace --locked
      - name: Build xcframework
        run: scripts/build-xcframework.sh release
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.SPM_DIR }}
          key: spm-${{ runner.os }}-${{ hashFiles('**/Package.swift', '**/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-
      - name: SpotCoreKit tests
        working-directory: SpotCoreKit
        run: >-
          xcodebuild test
          -scheme SpotCoreKit
          -destination 'platform=macOS'
          -clonedSourcePackagesDirPath "$SPM_DIR"
      # Release reuses the xcframework above; the build phase sees a fresh stamp and skips Rust.
      - name: Build app
        run: >-
          xcodebuild build
          -project Veya.xcodeproj
          -scheme Veya
          -configuration Release
          -destination 'generic/platform=macOS'
          -clonedSourcePackagesDirPath "$SPM_DIR"
          CODE_SIGNING_ALLOWED=NO

  # One Mac desktop has a single keyboard focus, pasteboard and window origin, so
  # UI tests cannot run side by side on one runner. Shards run on separate runners instead
  # (scripts/ui-test-shard.sh); PerformanceUITests keeps a runner to itself for stable metrics.
  ui-tests:
    runs-on: xcode-27
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, perf]
    env:
      SPM_DIR: ${{ github.workspace }}/.build/spm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        working-directory: core
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: core -> target
          shared-key: ui-tests
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.SPM_DIR }}
          key: spm-${{ runner.os }}-${{ hashFiles('**/Package.swift', '**/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-
      - name: Set Dark appearance
        # The suite is written against Dark; on Light the contrast audits fail.
        run: osascript -e 'tell application "System Events" to tell appearance preferences to set dark mode to true'
      # The runner's display defaults to 1024x768, which clamps the 1200 pt test window and
      # collapses the sidebar; the tests are written against a desktop-sized screen.
      - name: Keep the display awake
        run: |
          sudo pmset -a displaysleep 0 sleep 0 disablesleep 1
          defaults -currentHost write com.apple.screensaver idleTime 0
      - name: Set display resolution
        run: |
          brew install displayplacer
          screen=$(displayplacer list | awk '/Persistent screen id/ {print $4; exit}')
          displayplacer "id:$screen res:1920x1080 hz:60 color_depth:7 scaling:off origin:(0,0) degree:0"
      # Debug only: the VEYA_UI_TEST_SCENARIO fakes are compiled out of Release,
      # so this step also builds the debug xcframework.
      - name: UI tests (shard ${{ matrix.shard }})
        # Failures cluster after the first ~15 minutes, all "not foreground": the idle display sleeps or locks.
        run: >-
          caffeinate -dimsu
          xcodebuild test
          -project Veya.xcodeproj
          -scheme Veya
          -destination 'platform=macOS'
          $(scripts/ui-test-shard.sh ${{ matrix.shard }} 3)
          -clonedSourcePackagesDirPath "$SPM_DIR"
          -resultBundlePath "$RUNNER_TEMP/ui-tests.xcresult"
      # PBI-803: PerformanceUITests record the metrics; the budgets live in the script.
      - name: Performance budget
        if: matrix.shard == 'perf'
        run: scripts/check-performance-budget.sh "$RUNNER_TEMP/ui-tests.xcresult"
      # The scheme pre-action ignores its exit code and logs here instead.
      - name: Upload xcframework pre-action log
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: xcframework-preaction-log-${{ matrix.shard }}
          path: core/target/xcframework-preaction.log
          if-no-files-found: ignore
