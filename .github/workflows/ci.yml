name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  build-test:
    # Veya.xcodeproj (objectVersion 90) needs Xcode 26, the image default.
    runs-on: xcode-27
    # A cold cache compiles librespot three times (host debug, two release
    # arches); a timeout saves no cache, so every later run would be cold too.
    timeout-minutes: 60
    env:
      SPM_DIR: ${{ github.workspace }}/.build/spm
    steps:
      - name: Display info
        run: |
          system_profiler SPDisplaysDataType
          brew install displayplacer 2>&1 | tail -2
          displayplacer list || true
          defaults read /Library/Preferences/com.apple.windowserver.displays 2>&1 | head -40 || true
